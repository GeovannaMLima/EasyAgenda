services:
  postgres:
    image: postgres:16
    container_name: agendafacil-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: agendafacil
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  rabbitmq:
    image: rabbitmq:3-management
    container_name: agendafacil-rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  kafka:
    image: apache/kafka:latest
    container_name: agendafacil-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/agendafacil
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASS}
      SPRING_RABBITMQ_HOST: rabbitmq

    depends_on:
      - postgres
      - rabbitmq
    restart: unless-stopped

volumes:
  postgres_data:
  rabbitmq_data: